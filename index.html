<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grammaire Japonaise</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --header-bg: rgba(255, 255, 255, 0.9);
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #1e293b;
            --text-title: #0f172a;
            --text-muted: #64748b;
            
            /* Couleurs par Type */
            --color-primary: #059669;    /* Émeraude - Pattern */
            --color-vocab: #d97706;      /* Orange - Vocab */
            --color-conj: #2563eb;       /* Bleu - Conjugaison */
            --color-keigo: #7c3aed;      /* Violet - Keigo */
            
            --primary-light: #ecfdf5;
            --warning-bg: #fef2f2;
            --warning-border: #fca5a5;
            --warning-text: #991b1b;
            --jp-bg: #fef08a;
            --jp-text: #1e293b;
            --nuance-bg: #f1f5f9;
            --tag-bg: #e2e8f0;
            --tag-text: #475569;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121214;
                --header-bg: rgba(18, 18, 20, 0.9);
                --card-bg: #1a1a1e;
                --card-border: #2c2c35;
                --text-main: #e2e8f0;
                --text-title: #ffffff;
                --text-muted: #94a3b8;
                --color-primary: #10b981;
                --primary-light: rgba(16, 185, 129, 0.15);
                --warning-bg: #2d1515;
                --warning-border: #ef4444;
                --warning-text: #fca5a5;
                --jp-bg: #2e2a14;
                --jp-text: #fef08a;
                --nuance-bg: #222227;
                --tag-bg: #2c2c35;
                --tag-text: #cbd5e1;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            position: sticky; top: 0;
            background: var(--header-bg);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            width: 100%; max-width: 800px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            padding: 12px 20px; box-sizing: border-box;
            z-index: 10; border-bottom: 1px solid var(--card-border);
        }

        .header-container { width: 100%; display: flex; flex-direction: column; gap: 8px; }

        input#search {
            width: 100%; padding: 10px 16px; font-size: 16px;
            background-color: var(--card-bg); color: var(--text-title);
            border: 2px solid var(--card-border); border-radius: 10px;
            box-sizing: border-box; outline: none;
        }

        .filter-scroll {
            display: flex; gap: 6px; overflow-x: auto;
            padding-bottom: 4px; scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }

        .chip {
            padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .chip.active { background: var(--text-main); color: var(--bg-color); border-color: var(--text-main); }
        
        /* Couleurs spécifiques des chips de type */
        .chip-type.active[data-type="pattern"] { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .chip-type.active[data-type="vocabulary"] { background: var(--color-vocab); color: white; border-color: var(--color-vocab); }
        .chip-type.active[data-type="conjugation"] { background: var(--color-conj); color: white; border-color: var(--color-conj); }
        .chip-type.active[data-type="keigo"] { background: var(--color-keigo); color: white; border-color: var(--color-keigo); }

        main { width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }

        /* Carte avec code couleur */
        .grammar-preview-card {
            background: var(--card-bg); border-radius: 14px;
            margin-bottom: 14px; padding: 16px;
            border: 1px solid var(--card-border); 
            border-left-width: 6px; /* Bordure épaisse à gauche */
            cursor: pointer; position: relative; transition: 0.2s;
        }
        
        /* Classes couleurs par type */
        .card-pattern { border-left-color: var(--color-primary); }
        .card-vocabulary { border-left-color: var(--color-vocab); }
        .card-conjugation { border-left-color: var(--color-conj); }
        .card-keigo { border-left-color: var(--color-keigo); }

        .grammar-preview-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgb(0 0 0 / 0.1); }

        .card-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .grammar-title { font-size: 19px; font-weight: 700; color: var(--text-title); }
        .type-label { font-size: 10px; text-transform: uppercase; font-weight: 800; opacity: 0.7; }
        .level-badge { background: var(--nuance-bg); color: var(--text-main); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px; }

        /* Vue Détails */
        .detail-page { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--card-border); padding: 24px; }
        .construction-table { width: 100%; border-collapse: collapse; margin: 15px 0; background: var(--bg-color); border-radius: 10px; overflow: hidden; }
        .construction-table td { padding: 12px 16px; border-bottom: 1px solid var(--card-border); font-size: 15px; }
        .construction-table td:first-child { font-weight: bold; width: 130px; color: var(--color-primary); }

        .jp-sentence { background: var(--jp-bg); color: var(--jp-text); padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 18px; margin-bottom: 6px; display: inline-block; }
        .warning-box { background: var(--warning-bg); border-left: 4px solid var(--warning-border); color: var(--warning-text); padding: 14px; border-radius: 4px; margin: 15px 0; }
        .connection-link { background: var(--nuance-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 5px; }
        .tag { background: var(--tag-bg); color: var(--tag-text); font-size: 11px; padding: 3px 10px; border-radius: 15px; margin-right: 5px; }
    </style>
</head>
<body>

    <header id="header">
        <div class="header-container">
            <input type="text" id="search" placeholder="Rechercher...">
            <!-- Filtre Type -->
            <div class="filter-scroll">
                <div class="chip chip-type active" onclick="setFilter('type', 'all')">Tous les types</div>
                <div class="chip chip-type" data-type="pattern" onclick="setFilter('type', 'pattern')">Grammaire</div>
                <div class="chip chip-type" data-type="vocabulary" onclick="setFilter('vocabulary')">Vocabulaire</div>
                <div class="chip chip-type" data-type="conjugation" onclick="setFilter('conjugation')">Conjugaison</div>
                <div class="chip chip-type" data-type="keigo" onclick="setFilter('keigo')">Keigo</div>
            </div>
            <!-- Filtre Niveau -->
            <div class="filter-scroll">
                <div class="chip chip-level active" onclick="setFilter('level', 'all')">Tous niveaux</div>
                <div class="chip chip-level" onclick="setFilter('level', 'N1')">N1</div>
                <div class="chip chip-level" onclick="setFilter('level', 'N2')">N2</div>
                <div class="chip chip-level" onclick="setFilter('level', 'N3')">N3</div>
                <div class="chip chip-level" onclick="setFilter('level', 'N4')">N4</div>
                <div class="chip chip-level" onclick="setFilter('level', 'N5')">N5</div>
                <div class="chip" style="background: var(--primary-light); color: var(--color-primary);" onclick="randomPoint()">🎲 Hasard</div>
            </div>
        </div>
    </header>

    <main>
        <div id="list-view"></div>
        <div id="detail-view" style="display: none;"></div>
    </main>

    <script>
    let grammarData = [];
    let currentSearch = "";
    let activeType = "all";
    let activeLevel = "all";

    const typesLabels = {
        "pattern": "Grammaire",
        "vocabulary": "Vocabulaire",
        "conjugation": "Conjugaison",
        "keigo": "Keigo"
    };

    fetch('grammar.json').then(r => r.json()).then(data => {
        grammarData = data;
        renderList();
    });

    function setFilter(category, value) {
        if (category === 'type') activeType = value;
        if (category === 'level') activeLevel = value;
        
        // Update UI des chips
        document.querySelectorAll(`.chip-${category}`).forEach(el => {
            el.classList.toggle('active', (el.innerText.includes(value) || (value === 'all' && el.innerText.includes('Tous'))));
        });
        
        renderList();
    }

    document.getElementById('search').addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase();
        renderList();
    });

    function renderList() {
        const container = document.getElementById('list-view');
        document.getElementById('detail-view').style.display = 'none';
        container.style.display = 'block';
        window.scrollTo(0, 0);

        const filtered = grammarData.filter(item => {
            const matchesSearch = item.title.toLowerCase().includes(currentSearch) || 
                                 item.meaning.toLowerCase().includes(currentSearch) ||
                                 (item.tags && item.tags.some(t => t.toLowerCase().includes(currentSearch)));
            const matchesType = activeType === "all" || item.type === activeType;
            const matchesLevel = activeLevel === "all" || item.level.includes(activeLevel);
            
            return matchesSearch && matchesType && matchesLevel;
        });

        container.innerHTML = filtered.map(item => `
            <div class="grammar-preview-card card-${item.type}" onclick="showDetail('${item.id}')">
                <div class="card-header-top">
                    <span class="type-label" style="color: var(--color-${item.type === 'pattern' ? 'primary' : item.type === 'vocabulary' ? 'vocab' : item.type === 'conjugation' ? 'conj' : 'keigo'})">
                        ${typesLabels[item.type] || item.type}
                    </span>
                    <span class="level-badge">${item.level}</span>
                </div>
                <div class="grammar-title">${item.title}</div>
                <p style="color:var(--text-muted); margin: 6px 0 0 0; font-size:14px;">${item.meaning}</p>
            </div>
        `).join('');
    }

    function randomPoint() {
        const id = grammarData[Math.floor(Math.random() * grammarData.length)].id;
        showDetail(id);
    }

    function showDetail(id) {
        const item = grammarData.find(i => i.id === id);
        const container = document.getElementById('detail-view');
        document.getElementById('list-view').style.display = 'none';
        container.style.display = 'block';
        
        // Bouton retour dans le header
        document.getElementById('header').innerHTML = `
            <div class="header-container">
                <button class="connection-link" style="width:fit-content; padding: 10px 20px;" onclick="location.reload()">← Retour à la liste</button>
            </div>
        `;

        const rows = Object.entries(item.construction)
            .filter(([_, v]) => v)
            .map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');

        container.innerHTML = `
            <div class="detail-page">
                <div class="card-header-top">
                    <span class="type-label">${typesLabels[item.type]}</span>
                    <span class="level-badge">${item.level}</span>
                </div>
                <h1 style="margin: 5px 0;">${item.title}</h1>
                <p><strong>${item.meaning}</strong></p>
                <p class="nuance-text">${item.nuance}</p>
                
                ${rows ? `<h4>Construction</h4><table class="construction-table">${rows}</table>` : ''}
                
                ${item.warnings?.length ? `<div class="warning-box"><strong>Attention :</strong><ul>${item.warnings.map(w => `<li>${w}</li>`).join('')}</ul></div>` : ''}
                
                <h4>Exemples</h4>
                ${item.examples.map(ex => `
                    <div style="margin-bottom:15px; border-bottom:1px solid var(--card-border); padding-bottom:10px;">
                        <div class="jp-sentence">${ex.japanese}</div>
                        <div style="color:var(--text-muted); font-size:14px;">${ex.translation}</div>
                    </div>
                `).join('')}

                ${renderConnections(item)}
            </div>
        `;
        window.scrollTo(0, 0);
    }

    function renderConnections(item) {
        if (!item.connections) return '';
        let html = '<div style="margin-top:20px; border-top:1px dashed var(--card-border); padding-top:10px;"><h4>Liens</h4>';
        if (item.connections.confusions?.length) {
            html += `<p style="font-size:12px; font-weight:bold; color:var(--text-muted);">Confusions :</p>`;
            item.connections.confusions.forEach(c => {
                html += `<button class="connection-link" onclick="showDetail('${c.target_id}')">${c.target_id}</button>`;
            });
        }
        return html + '</div>';
    }
    </script>
</body>
</html>
